name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller SEARLab_RFID_App.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build one-click installer
        run: iscc installer.iss

      - name: Upload one-click installer (give this to your professor)
        uses: actions/upload-artifact@v4
        with:
          name: SEARLab_RFID_Setup
          path: installer_output/SEARLab_RFID_Setup.exe
          retention-days: 30

      - name: Upload raw app folder (backup / for your own testing)
        uses: actions/upload-artifact@v4
        with:
          name: SEARLab_RFID_App-windows
          path: dist/SEARLab_RFID_App/
          retention-days: 30
