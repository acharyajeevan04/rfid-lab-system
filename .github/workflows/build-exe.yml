name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller SEARLab_RFID_App.spec --noconfirm

      - name: Upload built app as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEARLab_RFID_App-windows
          path: dist/SEARLab_RFID_App/
          retention-days: 30
